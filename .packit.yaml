specfile_path: sdrangel.spec

actions:
  prepare-files:
    - cp cmake/cpack/org.sdrangel.SDRangel.metainfo.xml .

# keep synced with ./cmake/Modules/Cppcheck.cmake
csmock_args: >-
  --cppcheck-add-flag=--check-level=exhaustive
  --cppcheck-add-flag=--enable=warning,portability
  --cppcheck-add-flag=--library=qt
  --cppcheck-add-flag=--inconclusive
  --cppcheck-add-flag=--inline-suppr

jobs:
  - job: copr_build
    trigger: pull_request
    branch: rgetz-test-packit2
    identifier: qt6
    project: rgetz-sdrangel-qt6-{pr_id}
    targets:
      - fedora-all-x86_64
      - fedora-all-aarch64

  - job: copr_build
    trigger: pull_request
    branch: rgetz-test-packit2
    identifier: qt5
    project: rgetz-sdrangel-qt5-{pr_id}
    targets:
      fedora-all-x86_64:
        without_opts:
          - qt6
      fedora-all-aarch64:
        without_opts:
          - qt6
    csmock_args: >-
      --cppcheck-add-flag=--check-level=exhaustive
      --cppcheck-add-flag=--enable=warning,portability
      --cppcheck-add-flag=--library=qt
      --cppcheck-add-flag=--inconclusive
      --cppcheck-add-flag=--inline-suppr
      --rpm-build-opts="--without qt6"

  # builds used for the "base" of OpenScanHub differential analysis
  - job: copr_build
    trigger: commit
    branch: rgetz-test-packit2
    identifier: qt6
    project: rgetz-sdrangel-qt6
    targets:
      - fedora-all-x86_64

  - job: copr_build
    trigger: commit
    branch: rgetz-test-packit2
    identifier: qt5
    project: rgetz-sdrangel-qt5
    targets:
      fedora-all-x86_64:
        without_opts:
          - qt6
    csmock_args: >-
      --cppcheck-add-flag=--check-level=exhaustive
      --cppcheck-add-flag=--enable=warning,portability
      --cppcheck-add-flag=--library=qt
      --cppcheck-add-flag=--inconclusive
      --cppcheck-add-flag=--inline-suppr
      --rpm-build-opts="--without qt6"


